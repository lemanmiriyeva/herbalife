{% load static %}
{% load static i18n %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Herbalife{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- OWL CAROUSEL CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">





    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block css %}
    {% endblock %}
</head>

<body>

    {% include 'partials/header.html' %}

    {% block content %}{% endblock %}

    {% include 'partials/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    {% block js %}
    {% endblock %}
    <script>
        window.API_URLS = {
            storeInfo: "{% url 'api_store_info' %}",
            storeSwitch: "{% url 'api_store_switch' %}"
        };
    </script>
<script>
window.i18n={
    loading:"{% trans 'products_loading' %}",
    no_products:"{% trans 'products_not_found' %}",
    add_btn:"{% trans 'products_add_btn' %}",
    toast_added:"{% trans 'products_added_toast' %}",
    add_to_bag:"{% trans 'products_add_to_bag' %}",
    out_of_stock:"{% trans 'products_out_of_stock' %}",
    related:"{% trans 'products_related' %}",
    all_products:"{% trans 'products_all_label' %}",
    products_count:"{% trans 'products_count_label' %}",
    filter_flavor:"{% trans 'products_filter_flavor' %}",
    filter_size:"{% trans 'products_filter_size' %}",
    filter_price:"{% trans 'products_filter_price' %}",
    see_all:"{% trans 'products_see_all' %}",
    cart_empty:"{% trans 'cart_empty_text' %}",
    cart_continue:"{% trans 'cart_continue_shopping' %}",
    cart_title:"{% trans 'cart_title_label' %}",
    cart_price:"{% trans 'cart_price_label' %}",
    cart_flavor:"{% trans 'cart_flavor_label' %}",
    cart_subtotal:"{% trans 'cart_subtotal_label' %}",
    cart_remove:"{% trans 'cart_remove_btn' %}",
};
</script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
